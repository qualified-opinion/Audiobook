name: Android CI

# Tests, lint and the debug APK only. Release-signed APKs come from release.yml, which attaches
# them to published releases; this workflow no longer publishes anything on v* tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # v5 (Node 24). v6 moved caching to a closed-source component with new terms; not adopted here.
      - uses: gradle/actions/setup-gradle@v5
      # The Android SDK is preinstalled; AGP downloads compileSdk platform 37 if needed.
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/**
